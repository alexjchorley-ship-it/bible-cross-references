name: Format chapter review tests
on:
  push:
    branches:
      - feature/genesis-john-chapter-reviews
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/study/ChapterReview.test.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study/ChapterReview.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format chapter review UI tests"
            git push
          fi
