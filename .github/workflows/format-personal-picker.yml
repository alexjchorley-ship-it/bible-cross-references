name: Format personal link picker
on:
  push:
    branches:
      - feature/personal-links-polish-autocomplete
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/annotations/VerseTargetPicker.tsx src/features/annotations/PersonalCrossReferences.tsx src/features/annotations/PersonalCrossReferences.module.css src/features/annotations/PersonalCrossReferences.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/annotations
          if ! git diff --staged --quiet; then
            git commit -m "Format personal link picker"
            git push
          fi
