name: One-time Prettier for study tests
on:
  push:
    branches:
      - feat/verse-notes-and-study
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'style: apply Prettier to new tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/verse-notes-and-study
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/features/annotations/Notebook.test.tsx
          src/features/annotations/VerseAnnotations.test.tsx
          src/features/study/TyndaleNotes.test.tsx
      - name: Commit formatted tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/annotations/Notebook.test.tsx src/features/annotations/VerseAnnotations.test.tsx src/features/study/TyndaleNotes.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to new tests"
            git push origin HEAD:feat/verse-notes-and-study
          fi
