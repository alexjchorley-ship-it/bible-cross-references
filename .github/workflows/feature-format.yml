name: Format in-progress feature code

on:
  push:
    branches: [feat/verse-notes-and-study]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'alexjchorley-ship-it/bible-cross-references'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/verse-notes-and-study
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only changed feature files
        run: |
          npx prettier --write src/features/annotations src/features/study src/app/Explorer.tsx src/app/Explorer.module.css src/visualizations/shared/components/PassagePanel.tsx src/visualizations/threads/ThreadsStage.tsx src/visualizations/threads/ThreadsStage.module.css src/i18n/messages data/sources.json vite/site.ts
      - name: Commit formatting only if necessary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply upstream Prettier to feature code"
            git push origin HEAD:feat/verse-notes-and-study
          fi
