name: Format personal link feature
on:
  push:
    branches:
      - feature/personal-cross-references-and-search
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format feature and tests
        run: |
          npx prettier --write             src/features/annotations/PersonalCrossReferences.tsx             src/features/annotations/PersonalCrossReferences.test.tsx             src/features/annotations/storage.test.tsx             src/features/study/google-search.test.ts             src/visualizations/shared/personal-links.test.ts
      - name: Commit formatting when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --staged --quiet; then
            git commit -m "Format new personal link tests"
            git push
          fi
