name: Format expanded storage tests
on:
  push:
    branches:
      - feature/personal-cross-references-and-search
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/annotations/storage.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/annotations/storage.test.tsx
          if ! git diff --staged --quiet; then
            git commit -m "Format storage reconciliation tests"
            git push
          fi
