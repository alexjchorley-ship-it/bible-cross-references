name: One-off format cloud sync tests
on:
  push:
    branches: [feat/pages-and-cross-device-sync]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'alexjchorley-ship-it/bible-cross-references'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/annotations/CloudSyncPanel.test.tsx
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/annotations/CloudSyncPanel.test.tsx
            git commit -m 'Format sync panel tests'
            git push origin HEAD:feat/pages-and-cross-device-sync
          fi
