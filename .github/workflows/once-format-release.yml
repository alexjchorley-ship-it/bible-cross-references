name: One-off format release notes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message != 'style: format release notes'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/PROGRESS.md
      - name: Commit formatted release notes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format release notes"
            git push origin HEAD:main
          fi
