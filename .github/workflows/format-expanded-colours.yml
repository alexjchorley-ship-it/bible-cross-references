name: Format expanded colour palette changes
on:
  push:
    branches: [feat/mobile-colour-legend-expanded-palette]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/annotations/model.ts src/features/annotations/model.test.ts src/features/annotations/VerseAnnotations.tsx src/features/annotations/VerseAnnotations.test.tsx src/features/annotations/annotations.module.css src/visualizations/threads/ThreadsStage.module.css
      - name: Commit style updates
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/annotations src/visualizations/threads/ThreadsStage.module.css
            git commit -m 'Format mobile colour legend components'
            git push origin HEAD:feat/mobile-colour-legend-expanded-palette
          fi
