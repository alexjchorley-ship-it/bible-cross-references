name: Format inline study feature branch
on:
  push:
    branches: [feat/inline-study-notes-and-categories]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/annotations src/features/study/StudySection.tsx
      - name: Commit Prettier output
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/annotations src/features/study/StudySection.tsx
            git commit -m 'Format inline notes and categories'
            git push origin HEAD:feat/inline-study-notes-and-categories
          fi
